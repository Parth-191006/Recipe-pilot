<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Recipe Pilot — paste a recipe, get a shopping list</title>
    <meta
      name="description"
      content="Recipe Pilot turns any recipe into an aisle-organised shopping list, offline and on your phone. No account, no tracking, no signal needed. Free Android APK, MIT licensed."
    />
    <!-- Matches --scene-sky-top, the top of the page's sky gradient, so the
         browser chrome on a phone is the same colour as the page it frames. -->
    <meta name="theme-color" content="#1a2818" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/png" href="./app-icon.png" />
    <link rel="apple-touch-icon" href="./app-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Recipe Pilot — paste a recipe, get a shopping list" />
    <meta
      property="og:description"
      content="An offline-first recipe library and grocery-list converter for Android. Sorted by aisle, private by default, ~17 MB, no account."
    />
    <meta property="og:image" content="./screenshots/home.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Two fonts, one job each:
      • Fraunces — a soft, high-contrast serif with real warmth. Used only for
        headlines and numbers, at large optical sizes.
      • Karla — a plain, very readable humanist grotesque for everything else.

      Self-hosted out of ./fonts — see fonts/fonts.css for why. The page no
      longer talks to any third party, which matters on a page whose hero
      badge promises no account and the description promises no tracking.

      The two roman faces are preloaded because they are what the first screen
      draws; the italics load on demand, since only one word of the page is
      italic. `crossorigin` is required on a font preload even same-origin:
      font fetches are always CORS-mode, and without it the preload is
      discarded and the file is fetched a second time.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="./fonts/karla-vf-normal.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="./fonts/fraunces-vf-normal.woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
